<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Flexbox & Grid Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="logo">FlexGrid</div>

        <nav class="nav">
            <a href="#">Home</a>
            <a href="#gallery">Gallery</a>
            <button id="themeToggle">🌙</button>
        </nav>
    </header>

    <!-- Hero -->
    <section class="hero">
        <h1>Responsive Photo Gallery</h1>
        <p>Built with CSS Flexbox, Grid, and a Dark Mode toggle.</p>
    </section>

    <!-- Gallery -->
    <main class="container" id="gallery">
        <section class="grid-section">
            <figure class="card">
                <img src="https://picsum.photos/400/300?1" alt="Gallery image">
                <figcaption>Nature View</figcaption>
            </figure>

            <figure class="card">
                <img src="https://picsum.photos/400/300?2" alt="Gallery image">
                <figcaption>Urban Life</figcaption>
            </figure>

            <figure class="card">
                <img src="https://picsum.photos/400/300?3" alt="Gallery image">
                <figcaption>Mountains</figcaption>
            </figure>

            <figure class="card">
                <img src="https://picsum.photos/400/300?4" alt="Gallery image">
                <figcaption>Architecture</figcaption>
            </figure>

            <figure class="card">
                <img src="https://picsum.photos/400/300?5" alt="Gallery image">
                <figcaption>Landscape</figcaption>
            </figure>

            <figure class="card">
                <img src="https://picsum.photos/400/300?6" alt="Gallery image">
                <figcaption>Creative Space</figcaption>
            </figure>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 FlexGrid Gallery</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
